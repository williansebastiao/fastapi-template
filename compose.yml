services:

    db:
        image: postgres:16.3
        container_name: template_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: template_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - database:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        expose:
            - 5433
        networks:
            - template

networks:
    template:
        driver: bridge

volumes:
    database:
